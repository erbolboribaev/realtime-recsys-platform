[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recsys-platform"
version = "0.1.0"
description = "Real-time recommendation platform: Kafka, feature store, two-stage ML ranking, LLM explanations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "fsspec>=2024.6",
    "s3fs>=2024.6",
    "kafka-python-ng>=2.2.3",
    "redis>=5.0",
]

[project.optional-dependencies]
ml = [
    "qdrant-client>=1.10",
    "mlflow-skinny>=2.14",
]
rank = [
    "lightgbm>=4.5",
    "onnxmltools>=1.12",
    "onnxruntime>=1.18",
]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "qdrant-client>=1.10",
    "onnxruntime>=1.18",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

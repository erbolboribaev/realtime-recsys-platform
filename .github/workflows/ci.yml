name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,ml,rank,serve]"

      - name: Install the browser for the end-to-end test
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Tests
        run: pytest -v
        env:
          E2E_REQUIRED: "1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Storefront tests
        run: node --test "web/tests/*.test.js"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f infra/compose/docker-compose.yml --profile pipeline --profile serve --profile llm config --quiet

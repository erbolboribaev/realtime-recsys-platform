name: llm-evals

# Live evals call the real model, so they run on demand and weekly, not on every push.
# Needs the repository secret GROQ_API_KEY (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      REDIS_URL: redis://localhost:6379/0
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_DAILY_BUDGET_USD: "0.05"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[serve]"
      - name: Run evals (fails below 90% on any metric)
        run: python -m recsys.llm.evals --n 30 --seed 2
